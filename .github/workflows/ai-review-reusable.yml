# Canonical GitHub implementation. Consumers pin this workflow to a release SHA.
# The caller must use pull_request or workflow_dispatch, never pull_request_target.
name: Code Tribunal

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to review
        required: false
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false
      CURSOR_API_KEY:
        required: false
      AI_REVIEW_GITHUB_RESOLVE_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  AI_REVIEW_CONFIG: /opt/ai-review/config/review.yaml
  PYTHONPATH: /opt/ai-review/src
  AI_REVIEW_GITHUB_BOT_LOGIN: github-actions[bot]

jobs:
  prepare:
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          vars.AI_REVIEW_MANUAL != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    container: ghcr.io/seanleecoder/code-tribunal/ai-review-base:2.1-6ca538106d1eef7f449e5227408c99013c75aedc@sha256:d855b177b4bfcd109f7cf1c8d86908a98dc22e83c4fbce911fdad4a68ccdaa52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Checkout fetches files only. Trusted prepare validates the PR's
          # repository and binds this commit to the API revision before use.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
      - name: Prepare input bundle
        env:
          AI_REVIEW_POSTING_MODE: github_reviews
          # `vars` comes from the caller repository. Caller workflow `env` is not
          # inherited. Prepare resolves overrides once for every downstream stage.
          AI_REVIEW_CLAUDE_MODEL: ${{ vars.AI_REVIEW_CLAUDE_MODEL || '' }}
          AI_REVIEW_CODEX_MODEL: ${{ vars.AI_REVIEW_CODEX_MODEL || '' }}
          AI_REVIEW_OPENCODE_MODEL: ${{ vars.AI_REVIEW_OPENCODE_MODEL || '' }}
          AI_REVIEW_CURSOR_MODEL: ${{ vars.AI_REVIEW_CURSOR_MODEL || '' }}
          # Panel roster. Every reviewer is a peer: set AI_REVIEW_REVIEWERS to a
          # comma-separated list (e.g. `claude,codex,cursor`) and the seats you list are
          # enabled while every other configured seat sits out. Leave it unset to use the
          # defaults in config/review.yaml.
          AI_REVIEW_REVIEWERS: ${{ vars.AI_REVIEW_REVIEWERS || '' }}
          AI_REVIEW_CLAUDE_EFFORT: ${{ vars.AI_REVIEW_CLAUDE_EFFORT || '' }}
          AI_REVIEW_CODEX_EFFORT: ${{ vars.AI_REVIEW_CODEX_EFFORT || '' }}
          AI_REVIEW_OPENCODE_EFFORT: ${{ vars.AI_REVIEW_OPENCODE_EFFORT || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_REVIEW_GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          AI_REVIEW_GITHUB_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ -z "$AI_REVIEW_GITHUB_EXPECTED_HEAD_SHA" ]; then
            AI_REVIEW_GITHUB_EXPECTED_HEAD_SHA=$(git -c "safe.directory=$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')
            export AI_REVIEW_GITHUB_EXPECTED_HEAD_SHA
          fi
          python -P -m ai_review.input_bundle prepare --config "$AI_REVIEW_CONFIG" --out inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-inputs
          path: inputs/

  review:
    needs: prepare
    # Individual model failures are data for deterministic consensus. Keep the
    # fan-out running; consensus fails with panel_status=failed when no reviewer
    # succeeds, so this does not turn a total panel failure into a green run.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Outer ceiling for the 1800s review process timeout plus wrapper/artifact
    # overhead.
    timeout-minutes: 40
    container: ghcr.io/seanleecoder/code-tribunal/ai-review-reviewer:2.1-6ca538106d1eef7f449e5227408c99013c75aedc@sha256:280c858d58ceee662c95f02455bb6da3846802a5d19234dc28872c02df8fa985
    strategy:
      fail-fast: false
      matrix:
        reviewer: [claude, codex, opencode, cursor]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-inputs
          path: inputs
      - name: Run reviewer
        env:
          REVIEWER: ${{ matrix.reviewer }}
          AI_REVIEW_INPUT_DIR: inputs
          AI_REVIEW_OUTPUT_DIR: out
          AI_REVIEW_LOCAL_MOCK: "0"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Cursor's backend is a deliberate second egress destination, so this
          # credential reaches exactly one matrix entry and only when Cursor is on
          # the panel. `matrix.reviewer == 'cursor'` is load-bearing: the step env
          # is evaluated per matrix entry, so without it every seat's job would
          # carry the key whenever Cursor was selected.
          #
          # The roster check is a substring match because Actions expressions have
          # no split(); no other reviewer name contains "cursor".
          CURSOR_API_KEY: ${{ matrix.reviewer == 'cursor' && contains(vars.AI_REVIEW_REVIEWERS, 'cursor') && secrets.CURSOR_API_KEY || '' }}
        run: /opt/ai-review/adapters/run_reviewer.sh "$REVIEWER" review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-review-review-${{ matrix.reviewer }}
          path: out/

  critique:
    needs: [prepare, review]
    # Critique is optional evidence. A failed critic must not suppress consensus
    # over otherwise valid reviewer findings.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Outer ceiling for the 900s critique process timeout plus wrapper/artifact
    # overhead.
    timeout-minutes: 20
    container: ghcr.io/seanleecoder/code-tribunal/ai-review-reviewer:2.1-6ca538106d1eef7f449e5227408c99013c75aedc@sha256:280c858d58ceee662c95f02455bb6da3846802a5d19234dc28872c02df8fa985
    strategy:
      fail-fast: false
      matrix:
        reviewer: [claude, codex, opencode, cursor]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-review-review-*
          path: out
          merge-multiple: true
      - name: Run critique
        env:
          REVIEWER: ${{ matrix.reviewer }}
          AI_REVIEW_INPUT_DIR: inputs
          AI_REVIEW_OUTPUT_DIR: out
          AI_REVIEW_LOCAL_MOCK: "0"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Cursor's backend is a deliberate second egress destination, so this
          # credential reaches exactly one matrix entry and only when Cursor is on
          # the panel. `matrix.reviewer == 'cursor'` is load-bearing: the step env
          # is evaluated per matrix entry, so without it every seat's job would
          # carry the key whenever Cursor was selected.
          #
          # The roster check is a substring match because Actions expressions have
          # no split(); no other reviewer name contains "cursor".
          CURSOR_API_KEY: ${{ matrix.reviewer == 'cursor' && contains(vars.AI_REVIEW_REVIEWERS, 'cursor') && secrets.CURSOR_API_KEY || '' }}
        run: /opt/ai-review/adapters/run_reviewer.sh "$REVIEWER" critique
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-review-critique-${{ matrix.reviewer }}
          path: |
            out/critiques/${{ matrix.reviewer }}.json
            out/pooled_findings/${{ matrix.reviewer }}.json
            out/status/critique-${{ matrix.reviewer }}-*.txt

  consensus:
    needs: [prepare, review, critique]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    container: ghcr.io/seanleecoder/code-tribunal/ai-review-base:2.1-6ca538106d1eef7f449e5227408c99013c75aedc@sha256:d855b177b4bfcd109f7cf1c8d86908a98dc22e83c4fbce911fdad4a68ccdaa52
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-review-review-*
          path: reviewer-artifacts
          merge-multiple: true
      - name: Download critique artifacts
        id: download-critiques
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-review-critique-*
          path: reviewer-artifacts
          merge-multiple: true
      - name: Report missing critique artifacts
        if: steps.download-critiques.outcome == 'failure'
        run: echo "::warning::No critique artifacts were available; consensus will use reviewer findings only."
      - name: Build consensus
        run: python -m ai_review.consensus --inputs inputs --findings-dir reviewer-artifacts/findings --critiques-dir reviewer-artifacts/critiques --out out/consensus/consensus.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-consensus
          path: out/consensus/

  # The terminal product job. Code Tribunal publishes review output and never
  # decides whether a change may merge, so this job's result reports one thing:
  # whether publication completed. Findings of any severity exit zero.
  post:
    needs: [prepare, consensus]
    # `always()` so a failed `consensus` produces a *failed* `post` rather than a
    # skipped one. On GitHub a skipped required check never reports, and a
    # repository that requires `post` would wait on it forever. Gating on
    # `prepare` keeps the job skipped for the events `prepare` itself declines.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    container: ghcr.io/seanleecoder/code-tribunal/ai-review-base:2.1-6ca538106d1eef7f449e5227408c99013c75aedc@sha256:d855b177b4bfcd109f7cf1c8d86908a98dc22e83c4fbce911fdad4a68ccdaa52
    steps:
      # Before the downloads: with `always()` this job runs after a failed
      # consensus, and the consensus artifact it needs does not exist. Fail on the
      # upstream reason rather than on a confusing missing-artifact error.
      - name: Require successful consensus
        if: needs.consensus.result != 'success'
        run: |
          echo "::error::consensus job result was '${{ needs.consensus.result }}'; no review to publish."
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-inputs
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-consensus
          path: out/consensus
      - name: Post GitHub review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_REVIEW_GITHUB_RESOLVE_TOKEN: ${{ secrets.AI_REVIEW_GITHUB_RESOLVE_TOKEN }}
        run: python -m ai_review.post --inputs inputs --consensus out/consensus/consensus.json --out out/post/post_result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-review-post
          path: out/post/
