name: Publish Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to publish using current main
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-publication
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.flags.outputs.prerelease }}
      latest: ${{ steps.flags.outputs.latest }}
      tag_object: ${{ steps.certificate.outputs.tag_object }}
    steps:
      - name: Require manual dispatch from main
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$EVENT_REF" != refs/heads/main ]]; then
            echo 'Release retries must be dispatched from main' >&2
            exit 1
          fi

      - name: Checkout protected main and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compute publication flags
        id: flags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=ai-review/src:scripts python scripts/release_finalize.py publication-flags \
            --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Verify signed certificate and prepare publication files
        id: certificate
        run: |
          set -euo pipefail
          PYTHONPATH=ai-review/src:scripts python scripts/release_finalize.py publish \
            --tag "$RELEASE_TAG" --out "$RUNNER_TEMP/release" --github-output "$GITHUB_OUTPUT"

      # Tag code has executed. Subsequent steps may only upload artifacts;
      # never run workspace commands or introduce an authenticated step here.
      - name: Retain private publication files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication
          path: |
            ${{ runner.temp }}/release/*-release-manifest.json
            ${{ runner.temp }}/release/*-release-manifest.json.sha256
            ${{ runner.temp }}/release/*-release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated publication files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publication
          path: ${{ runner.temp }}/release

      - name: Publish final notes, manifest, and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          LATEST: ${{ needs.validate.outputs.latest }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: |
          set -euo pipefail
          case "$PRERELEASE:$LATEST" in
            true:false) flags=(--prerelease --latest=false) ;;
            false:false) flags=(--latest=false) ;;
            false:true) flags=(--latest) ;;
            *) echo 'Invalid validated publication flags' >&2; exit 1 ;;
          esac
          if [[ ! "$TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid validated tag object' >&2
            exit 1
          fi
          remote_object=$(gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          if [[ "$remote_object" != "$TAG_OBJECT" ]]; then
            echo 'Remote tag changed after validation' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/code-tribunal-${RELEASE_TAG}-release-manifest.json" \
            "$RUNNER_TEMP/release/code-tribunal-${RELEASE_TAG}-release-manifest.json.sha256" \
            --repo "$RELEASE_REPOSITORY" --verify-tag --title "Code Tribunal ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release/code-tribunal-${RELEASE_TAG}-release-notes.md" \
            "${flags[@]}"
