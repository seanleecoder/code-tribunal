name: Publish Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag (v2.1.0 or later) to publish using current main
        required: true
        type: string
      latest:
        description: Mark the release as latest; clear it for a backport
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-publication
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read the cited Candidate Canary run and download its artifacts.
      actions: read
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    steps:
      - name: Require manual dispatch from main
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$EVENT_REF" != refs/heads/main ]]; then
            echo 'Release retries must be dispatched from main' >&2
            exit 1
          fi

      # Main supplies the checker and the signer authority. The tag's own code
      # never runs: check_release.py reads the release commit through git archive.
      - name: Checkout protected main and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Verify the signed tag, its pins, and the cited canary run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=ai-review/src:scripts python scripts/check_release.py publish \
            --tag "$RELEASE_TAG" --out "$RUNNER_TEMP/release" \
            --publish-run-url "$PUBLISH_RUN_URL" --github-output "$GITHUB_OUTPUT"

      - name: Retain the release body
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-body
          path: ${{ runner.temp }}/release/release-body.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release body
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-body
          path: ${{ runner.temp }}/release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.latest }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: |
          set -euo pipefail
          case "$PRERELEASE:$LATEST" in
            true:*) flags=(--prerelease --latest=false) ;;
            false:false) flags=(--latest=false) ;;
            false:true) flags=() ;;
            *) echo 'Invalid validated publication flags' >&2; exit 1 ;;
          esac
          if [[ ! "$TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid validated tag object' >&2
            exit 1
          fi
          remote_object=$(gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          if [[ "$remote_object" != "$TAG_OBJECT" ]]; then
            echo 'Remote tag changed after validation' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" --verify-tag --title "Code Tribunal ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release/release-body.md" \
            "${flags[@]}"
