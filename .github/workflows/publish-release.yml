name: Publish Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to publish using current main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require manual dispatch from main
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$EVENT_REF" != refs/heads/main ]]; then
            echo 'Release retries must be dispatched from main' >&2
            exit 1
          fi

      - name: Checkout protected main and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Verify signed release tree and publish committed notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PYTHONPATH: ai-review/src
        run: python scripts/release_publish.py --tag "$RELEASE_TAG"
