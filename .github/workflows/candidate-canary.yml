name: Candidate Canary
run-name: Candidate Canary ${{ inputs.runtime_source }} [${{ inputs.campaigns }}]

on:
  workflow_dispatch:
    inputs:
      runtime_source:
        description: Full protected-main source commit used to build both images
        required: true
        type: string
      base_image:
        description: Digest-pinned ai-review-base image reference
        required: true
        type: string
      reviewer_image:
        description: Digest-pinned ai-review-reviewer image reference
        required: true
        type: string
      campaigns:
        description: >-
          Comma-separated campaigns to run: panel (real four-seat panel, spends
          tokens), lifecycle (zero-token mock Chain B), and hostile (zero-token
          GitLab hostile-MR credential boundary)
        required: false
        default: panel,lifecycle,hostile
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: candidate-canary
  cancel-in-progress: false

jobs:
  verify-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: candidate-canary
    outputs:
      branch: ${{ steps.identity.outputs.branch }}
    steps:
      - name: Check out protected orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source, image, and campaign inputs
        id: identity
        env:
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          BASE_IMAGE: ${{ inputs.base_image }}
          REVIEWER_IMAGE: ${{ inputs.reviewer_image }}
          CAMPAIGNS: ${{ inputs.campaigns }}
        run: |
          python scripts/validate_candidate_identity.py \
            --runtime-source "$RUNTIME_SOURCE" \
            --base-image "$BASE_IMAGE" \
            --reviewer-image "$REVIEWER_IMAGE" \
            --campaigns "$CAMPAIGNS" \
            --github-output "$GITHUB_OUTPUT"
      - name: Pull candidate images
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          REVIEWER_IMAGE: ${{ inputs.reviewer_image }}
        run: |
          docker pull "$BASE_IMAGE"
          docker pull "$REVIEWER_IMAGE"
      - name: Verify candidate image identity and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source }}
          BASE_IMAGE: ${{ inputs.base_image }}
          REVIEWER_IMAGE: ${{ inputs.reviewer_image }}
          CAMPAIGNS: ${{ inputs.campaigns }}
        run: |
          python scripts/validate_candidate_identity.py \
            --runtime-source "$RUNTIME_SOURCE" \
            --base-image "$BASE_IMAGE" \
            --reviewer-image "$REVIEWER_IMAGE" \
            --campaigns "$CAMPAIGNS" \
            --verify-images \
            --candidate-out "$RUNNER_TEMP/identity/candidate.json"
      # Publication binds the cited run to the release pins through this file.
      - name: Upload candidate identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-canary-identity
          path: ${{ runner.temp }}/identity/candidate.json
          if-no-files-found: error

  campaign:
    needs: verify-candidate
    if: contains(format(',{0},', inputs.campaigns), ',panel,')
    runs-on: ubuntu-latest
    environment: candidate-canary
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: github
            token_secret: CANDIDATE_CANARY_GITHUB_TOKEN
            token_env: GH_TOKEN
          - platform: gitlab
            token_secret: CANDIDATE_CANARY_GITLAB_TOKEN
            token_env: GITLAB_CANARY_TOKEN
    env:
      PYTHONPATH: ai-review/src
    steps:
      - name: Check out protected orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install validation dependency
        run: >-
          python -m pip install
          --constraint ai-review/images/python-constraints.txt
          jsonschema pyyaml
      - name: Create isolated demo change
        env:
          CANARY_TOKEN: ${{ secrets[matrix.token_secret] }}
          PLATFORM: ${{ matrix.platform }}
          TOKEN_ENV: ${{ matrix.token_env }}
        run: |
          state="$RUNNER_TEMP/${PLATFORM}-state.json"
          token_value="$CANARY_TOKEN"
          unset CANARY_TOKEN
          common=(
            --branch "${{ needs.verify-candidate.outputs.branch }}-${PLATFORM}"
            --runtime-source "${{ inputs.runtime_source }}"
            --base-image "${{ inputs.base_image }}"
            --reviewer-image "${{ inputs.reviewer_image }}"
            --state "$state"
          )
          if [[ "$PLATFORM" == github ]]; then
            env "$TOKEN_ENV=$token_value" python scripts/canary.py github panel create \
              "${common[@]}" \
              --workflow .github/workflows/ai-review-reusable.yml \
              --workdir "$RUNNER_TEMP/github"
          else
            env "$TOKEN_ENV=$token_value" python scripts/canary.py gitlab panel create \
              "${common[@]}" \
              --template ai-review/ci/review.gitlab-ci.yml \
              --child-template ai-review/ci/review-child.gitlab-ci.yml
          fi
      - name: Run and collect review
        env:
          CANARY_TOKEN: ${{ secrets[matrix.token_secret] }}
          PLATFORM: ${{ matrix.platform }}
          TOKEN_ENV: ${{ matrix.token_env }}
        run: |
          token_value="$CANARY_TOKEN"
          unset CANARY_TOKEN
          env "$TOKEN_ENV=$token_value" \
            python scripts/canary.py "$PLATFORM" panel collect \
              --state "$RUNNER_TEMP/${PLATFORM}-state.json" \
              --destination "$RUNNER_TEMP/${PLATFORM}-result"
      - name: Clean up demo
        id: cleanup
        if: always()
        env:
          CANARY_TOKEN: ${{ secrets[matrix.token_secret] }}
          PLATFORM: ${{ matrix.platform }}
          TOKEN_ENV: ${{ matrix.token_env }}
        run: |
          token_value="$CANARY_TOKEN"
          unset CANARY_TOKEN
          env "$TOKEN_ENV=$token_value" \
            python scripts/canary.py "$PLATFORM" panel cleanup \
              --state "$RUNNER_TEMP/${PLATFORM}-state.json"
      - name: Write redacted success summary
        id: summary
        if: success()
        env:
          PLATFORM: ${{ matrix.platform }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          python scripts/validate_candidate_canary.py \
            --platform "$PLATFORM" \
            --state "$RUNNER_TEMP/${PLATFORM}-state.json" \
            --inputs "$RUNNER_TEMP/${PLATFORM}-result/inputs" \
            --output "$RUNNER_TEMP/${PLATFORM}-result/out" \
            --runtime-source "${{ inputs.runtime_source }}" \
            --base-image "${{ inputs.base_image }}" \
            --reviewer-image "${{ inputs.reviewer_image }}" \
            --cleanup-status "$CLEANUP_OUTCOME" \
            --summary-out "${PLATFORM}-summary.json"
      - name: Write redacted incomplete summary
        if: always() && steps.summary.outcome != 'success'
        env:
          PLATFORM: ${{ matrix.platform }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          python scripts/validate_candidate_canary.py \
            --incomplete \
            --platform "$PLATFORM" \
            --state "$RUNNER_TEMP/${PLATFORM}-state.json" \
            --runtime-source "${{ inputs.runtime_source }}" \
            --base-image "${{ inputs.base_image }}" \
            --reviewer-image "${{ inputs.reviewer_image }}" \
            --cleanup-status "$CLEANUP_OUTCOME" \
            --summary-out "${PLATFORM}-summary.json"
      - name: Upload redacted summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-canary-${{ matrix.platform }}-summary
          path: ${{ matrix.platform }}-summary.json
          if-no-files-found: error

  lifecycle:
    needs: verify-candidate
    if: contains(format(',{0},', inputs.campaigns), ',lifecycle,')
    runs-on: ubuntu-latest
    environment: candidate-canary
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: github
            token_secret: CANDIDATE_CANARY_GITHUB_TOKEN
            token_env: GH_TOKEN
          - platform: gitlab
            token_secret: CANDIDATE_CANARY_GITLAB_TOKEN
            token_env: GITLAB_CANARY_TOKEN
    env:
      PYTHONPATH: ai-review/src:scripts
    steps:
      - name: Check out protected orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install validation dependency
        run: >-
          python -m pip install
          --constraint ai-review/images/python-constraints.txt
          jsonschema pyyaml
      - name: Create isolated mock lifecycle change
        env:
          CANARY_TOKEN: ${{ secrets[matrix.token_secret] }}
          PLATFORM: ${{ matrix.platform }}
          TOKEN_ENV: ${{ matrix.token_env }}
        run: |
          token_value="$CANARY_TOKEN"
          unset CANARY_TOKEN
          common=(
            --branch "${{ needs.verify-candidate.outputs.branch }}-${PLATFORM}-lifecycle"
            --state "$RUNNER_TEMP/${PLATFORM}-lifecycle-state.json"
            --runtime-source "${{ inputs.runtime_source }}"
            --base-image "${{ inputs.base_image }}"
            --reviewer-image "${{ inputs.reviewer_image }}"
          )
          if [[ "$PLATFORM" == github ]]; then
            env "$TOKEN_ENV=$token_value" python scripts/canary.py github lifecycle create \
              "${common[@]}" \
              --workflow .github/workflows/ai-review-reusable.yml \
              --workdir "$RUNNER_TEMP/github-lifecycle"
          else
            env "$TOKEN_ENV=$token_value" python scripts/canary.py gitlab lifecycle create \
              "${common[@]}" \
              --template ai-review/ci/review.gitlab-ci.yml \
              --child-template ai-review/ci/review-child.gitlab-ci.yml
          fi
      - name: Drive the lifecycle steps
        env:
          CANARY_TOKEN: ${{ secrets[matrix.token_secret] }}
          PLATFORM: ${{ matrix.platform }}
          TOKEN_ENV: ${{ matrix.token_env }}
        run: |
          token_value="$CANARY_TOKEN"
          unset CANARY_TOKEN
          extra=()
          [[ "$PLATFORM" == github ]] && extra=(--workdir "$RUNNER_TEMP/github-lifecycle")
          env "$TOKEN_ENV=$token_value" python scripts/canary.py "$PLATFORM" lifecycle run \
            --state "$RUNNER_TEMP/${PLATFORM}-lifecycle-state.json" \
            --summary-out "${PLATFORM}-lifecycle-summary.json" \
            "${extra[@]}"
      - name: Clean up demo
        if: always()
        env:
          CANARY_TOKEN: ${{ secrets[matrix.token_secret] }}
          PLATFORM: ${{ matrix.platform }}
          TOKEN_ENV: ${{ matrix.token_env }}
        run: |
          token_value="$CANARY_TOKEN"
          unset CANARY_TOKEN
          env "$TOKEN_ENV=$token_value" python scripts/canary.py "$PLATFORM" lifecycle cleanup \
            --state "$RUNNER_TEMP/${PLATFORM}-lifecycle-state.json"
      - name: Upload redacted lifecycle summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-canary-${{ matrix.platform }}-lifecycle-summary
          path: ${{ matrix.platform }}-lifecycle-summary.json
          if-no-files-found: error

  hostile:
    needs: verify-candidate
    if: contains(format(',{0},', inputs.campaigns), ',hostile,')
    runs-on: ubuntu-latest
    environment: candidate-canary
    env:
      PYTHONPATH: ai-review/src:scripts
    steps:
      - name: Check out protected orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install validation dependency
        run: >-
          python -m pip install
          --constraint ai-review/images/python-constraints.txt
          jsonschema pyyaml
      - name: Open the unprotected hostile merge request
        env:
          GITLAB_CANARY_TOKEN: ${{ secrets.CANDIDATE_CANARY_GITLAB_TOKEN }}
        run: |
          python scripts/canary.py gitlab hostile create \
            --branch "${{ needs.verify-candidate.outputs.branch }}-gitlab-hostile" \
            --state "$RUNNER_TEMP/gitlab-hostile-state.json" \
            --runtime-source "${{ inputs.runtime_source }}" \
            --base-image "${{ inputs.base_image }}" \
            --reviewer-image "${{ inputs.reviewer_image }}" \
            --template ai-review/ci/review.gitlab-ci.yml \
            --child-template ai-review/ci/review-child.gitlab-ci.yml
      - name: Check the credential boundary
        env:
          GITLAB_CANARY_TOKEN: ${{ secrets.CANDIDATE_CANARY_GITLAB_TOKEN }}
        run: |
          python scripts/canary.py gitlab hostile run \
            --state "$RUNNER_TEMP/gitlab-hostile-state.json" \
            --summary-out gitlab-hostile-summary.json
      - name: Clean up demo
        if: always()
        env:
          GITLAB_CANARY_TOKEN: ${{ secrets.CANDIDATE_CANARY_GITLAB_TOKEN }}
        run: |
          python scripts/canary.py gitlab hostile cleanup \
            --state "$RUNNER_TEMP/gitlab-hostile-state.json"
      - name: Upload redacted hostile-MR summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-canary-gitlab-hostile-summary
          path: gitlab-hostile-summary.json
          if-no-files-found: error
