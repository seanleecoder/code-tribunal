name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    uses: ./.github/workflows/ai-review-reusable.yml
    with:
      pr_number: ${{ inputs.pr_number || '' }}
    secrets: inherit
