name: Publish AI Review Images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: seanleecoder/code-tribunal
  IMAGE_VERSION: "1.0"
  AI_REVIEW_CLAUDE_NPM_PACKAGE: "@anthropic-ai/claude-code"
  AI_REVIEW_CODEX_NPM_PACKAGE: "@openai/codex"
  AI_REVIEW_OPENCODE_NPM_PACKAGE: "opencode-ai"

jobs:
  build-preflight:
    name: Build and preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate supply-chain pins
        shell: bash
        run: python scripts/check_supply_chain_pins.py

      - name: Define image tags
        shell: bash
        run: |
          set -euo pipefail
          base_image="${REGISTRY}/${IMAGE_NAMESPACE}/ai-review-base"
          reviewer_image="${REGISTRY}/${IMAGE_NAMESPACE}/ai-review-reviewer"
          image_tag="${IMAGE_VERSION}-${GITHUB_SHA}"
          {
            echo "AI_REVIEW_BASE_IMAGE=${base_image}"
            echo "AI_REVIEW_REVIEWER_IMAGE=${reviewer_image}"
            echo "AI_REVIEW_IMAGE_TAG=${image_tag}"
            echo "AI_REVIEW_BASE_TAG=${base_image}:${image_tag}"
            echo "AI_REVIEW_REVIEWER_TAG=${reviewer_image}:${image_tag}"
          } >> "$GITHUB_ENV"

      - name: Build base image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --file ai-review/images/base.Dockerfile \
            --tag "$AI_REVIEW_BASE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .

      - name: Preflight base image
        shell: bash
        run: |
          set -euo pipefail
          # The suite creates executable fake reviewer CLIs under /tmp. Keep it
          # checkout-independent, but do not mount /tmp noexec for this command.
          # Verify the image's OWN fixtures first: the read-only mount below shadows
          # /opt/ai-review/tests, and the reviewer preflight resolves --diff/--repo
          # from these paths with no mount at all, so a missing or mispackaged fixture
          # must fail here rather than be hidden by the overlay.
          docker run --rm --read-only --tmpfs /tmp "$AI_REVIEW_BASE_TAG" sh -euc '
            test -f /opt/ai-review/tests/fixtures/diffs/simple.diff
            test -d /opt/ai-review/tests/fixtures/repos/simple
          '
          # Mount the checkout's tests rather than shipping them in the image. This
          # still proves "this exact image passes the suite", and it proves it against
          # the current tests instead of whatever was frozen into the layers.
          # Overlay the image's own tests path: the suite resolves config/ and schemas/
          # relative to its own location, so mounting elsewhere would make it read the
          # mount point instead of the image's /opt/ai-review.
          # `unittest discover` exits 0 when it collects nothing, and `docker run -v`
          # silently creates an empty directory when the host path is missing or has
          # been renamed. Without a floor on collected tests this preflight could
          # report success having verified nothing and still publish the image — a
          # property the removed in-image `COPY` + `RUN` had for free, because `COPY`
          # fails on a missing path.
          docker run --rm --workdir /tmp \
            -v "$GITHUB_WORKSPACE/ai-review/tests:/opt/ai-review/tests:ro" \
            "$AI_REVIEW_BASE_TAG" \
            python -m unittest discover -s /opt/ai-review/tests -p 'test_*.py' \
            2>&1 | tee /tmp/ai-review-suite.log
          # unittest counts skipped cases in "Ran N", and many cases skip in the
          # image (repository-only guards), so N alone is a COLLECTION floor. Subtract
          # the skips to get an EXECUTION floor: without this, a suite that skipped
          # everything would satisfy the check while asserting nothing.
          MIN_EXECUTED_TESTS=400
          ran="$(sed -n 's/^Ran \([0-9][0-9]*\) test[s]* in .*/\1/p' /tmp/ai-review-suite.log | tail -1)"
          skipped="$(sed -n 's/.*skipped=\([0-9][0-9]*\).*/\1/p' /tmp/ai-review-suite.log | tail -1)"
          ran="${ran:-0}"
          skipped="${skipped:-0}"
          executed=$((ran - skipped))
          if [ "$executed" -lt "$MIN_EXECUTED_TESTS" ]; then
            echo "in-image suite executed $executed tests (ran $ran, skipped $skipped);" \
              "expected at least $MIN_EXECUTED_TESTS" >&2
            exit 1
          fi
          echo "in-image suite executed $executed tests (ran $ran, skipped $skipped)"
          docker run --rm --workdir /tmp --read-only --tmpfs /tmp "$AI_REVIEW_BASE_TAG" \
            python -m compileall -q /opt/ai-review/src
          # Run this as early as possible because the complete checkout validator
          # intentionally requires a pristine workspace, including ignored files.
          # The default checkout ref must resolve to GITHUB_SHA; update the expected
          # SHA here if the checkout step is ever changed to use a custom ref.
          # Pin a non-owner uid and prove the ownership mismatch is real. HOME is
          # on the writable tmpfs so this does not rely on the image user's home.
          docker run --rm --user 65532:65532 --workdir /runner-checkout \
            --read-only --tmpfs /tmp --env HOME=/tmp \
            --env "PREFLIGHT_HEAD_SHA=$GITHUB_SHA" \
            --volume "$GITHUB_WORKSPACE:/runner-checkout:ro" "$AI_REVIEW_BASE_TAG" \
            python -c '
          import os
          import subprocess
          from pathlib import Path
          from ai_review.input_bundle import _github_checkout_head

          repo = Path.cwd()
          if repo.stat().st_uid == os.geteuid():
              raise SystemExit("preflight requires checkout owner and container uid to differ")
          for bare_args in (
              ("rev-parse", "--verify", "HEAD^{commit}"),
              ("status", "--porcelain=v1"),
          ):
              bare = subprocess.run(
                  ["git", *bare_args],
                  cwd=repo,
                  capture_output=True,
                  text=True,
                  check=False,
              )
              detail = (bare.stderr or bare.stdout).lower()
              if bare.returncode == 0 or "dubious ownership" not in detail:
                  bare_command = " ".join(bare_args)
                  raise SystemExit(
                      "preflight negative control expected dubious ownership from "
                      "bare git " + bare_command
                  )
          _github_checkout_head(
              repo,
              Path("/tmp/inputs"),
              expected_head_sha=os.environ["PREFLIGHT_HEAD_SHA"],
          )
          '
          for module in input_bundle consensus post gate schema; do
            docker run --rm --workdir /tmp --read-only --tmpfs /tmp "$AI_REVIEW_BASE_TAG" \
              python -m "ai_review.$module" --help >/dev/null
          done

      - name: Build reviewer image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --file ai-review/images/reviewer.Dockerfile \
            --tag "$AI_REVIEW_REVIEWER_TAG" \
            --build-arg "AI_REVIEW_BASE_IMAGE=$AI_REVIEW_BASE_TAG" \
            --build-arg "CLAUDE_NPM_PACKAGE=$AI_REVIEW_CLAUDE_NPM_PACKAGE" \
            --build-arg "CODEX_NPM_PACKAGE=$AI_REVIEW_CODEX_NPM_PACKAGE" \
            --build-arg "OPENCODE_NPM_PACKAGE=$AI_REVIEW_OPENCODE_NPM_PACKAGE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .

      - name: Preflight reviewer image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /tmp --read-only --tmpfs /tmp \
            "$AI_REVIEW_REVIEWER_TAG" sh -euxc '
            claude --version
            codex --version
            opencode --version
            rm -rf /tmp/ai-review-preflight
            export PYTHONPATH=/opt/ai-review/src
            export AI_REVIEW_CONFIG=/opt/ai-review/config/review.yaml
            export AI_REVIEW_INPUT_DIR=/tmp/ai-review-preflight/inputs
            export AI_REVIEW_OUTPUT_DIR=/tmp/ai-review-preflight/out
            export AI_REVIEW_LOCAL_MOCK=1
            export AI_REVIEW_ALLOW_LOCAL_MOCK=true
            python -m ai_review.input_bundle local \
              --config "$AI_REVIEW_CONFIG" \
              --diff /opt/ai-review/tests/fixtures/diffs/simple.diff \
              --repo /opt/ai-review/tests/fixtures/repos/simple \
              --out "$AI_REVIEW_INPUT_DIR"
            for reviewer in claude codex opencode; do
              /opt/ai-review/adapters/run_reviewer.sh "$reviewer" review
              python -m ai_review.schema validate \
                --schema finding_batch.schema.json \
                --input "$AI_REVIEW_OUTPUT_DIR/findings/$reviewer.json"
            done
            python -m ai_review.consensus \
              --config "$AI_REVIEW_CONFIG" \
              --inputs "$AI_REVIEW_INPUT_DIR" \
              --findings-dir "$AI_REVIEW_OUTPUT_DIR/findings" \
              --out "$AI_REVIEW_OUTPUT_DIR/consensus/consensus.json"
            python -m ai_review.schema validate \
              --schema consensus.schema.json \
              --input "$AI_REVIEW_OUTPUT_DIR/consensus/consensus.json"
          '

      - name: Verify pinned ripgrep and effective external-directory deny
        # Spec-51 gate. Proves the pinned rg and opencode are the binaries that
        # resolve on the adapter's fixed trusted PATH, and that the adapter's own
        # generated config resolves external_directory to deny while read/grep/glob
        # stay allowed.
        #
        # Deliberately a step in this job rather than a separate one, and with no
        # event condition. It needs no secret, so it needs no event restriction —
        # and a separate job could only consume the image
        # artifact, which is not uploaded for pull requests, so the probe would have
        # skipped exactly the runs where a ripgrep.pin or adapter change is under
        # review. Here it gates merge as well as publication, since publish needs
        # this job. It runs before the artifact is saved so a failed probe cannot
        # even hand an image downstream.
        shell: bash
        run: scripts/smoke_opencode_search_tools.sh "$AI_REVIEW_REVIEWER_TAG"

      - name: Verify the OpenCode structured-output transport
        # Spec-51 follow-up. The reviewer returns its batch by calling the
        # StructuredOutput tool OpenCode injects for a json_schema format, and the
        # adapter's "*": "deny" permission wildcard once covered that tool: the model
        # was told to call a tool it was never offered and every review failed. No
        # other check could see it — the config was well-formed, the session was
        # created, and permissions resolved as documented. This runs the shipped
        # adapter and client against a loopback stub provider, so the transport is
        # exercised on every build without a provider secret, and asserts the
        # negative control (remove the permission, lose the tool and the run).
        #
        # Same placement rationale as the step above: a step in this job with no event
        # condition, before the image artifact is saved, so it gates merge as well as
        # publication and a failed probe cannot hand an image downstream.
        shell: bash
        run: scripts/smoke_opencode_structured_output.sh "$AI_REVIEW_REVIEWER_TAG"

      - name: Save preflighted image artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          docker save "$AI_REVIEW_BASE_TAG" "$AI_REVIEW_REVIEWER_TAG" \
            | gzip -c > image-artifacts/ai-review-images.tar.gz

      - name: Upload preflighted image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-images
          path: image-artifacts/ai-review-images.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Report preflight-only run
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: echo "Built and preflighted images only; publishing is restricted to main."

  publish:
    name: Publish and attest
    runs-on: ubuntu-latest
    needs: build-preflight
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Define image tags
        shell: bash
        run: |
          set -euo pipefail
          base_image="${REGISTRY}/${IMAGE_NAMESPACE}/ai-review-base"
          reviewer_image="${REGISTRY}/${IMAGE_NAMESPACE}/ai-review-reviewer"
          image_tag="${IMAGE_VERSION}-${GITHUB_SHA}"
          {
            echo "AI_REVIEW_BASE_IMAGE=${base_image}"
            echo "AI_REVIEW_REVIEWER_IMAGE=${reviewer_image}"
            echo "AI_REVIEW_IMAGE_TAG=${image_tag}"
            echo "AI_REVIEW_BASE_TAG=${base_image}:${image_tag}"
            echo "AI_REVIEW_REVIEWER_TAG=${reviewer_image}:${image_tag}"
          } >> "$GITHUB_ENV"

      - name: Download preflighted image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-images
          path: image-artifacts

      - name: Load preflighted images
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc image-artifacts/ai-review-images.tar.gz | docker load
          docker image inspect "$AI_REVIEW_BASE_TAG" >/dev/null
          docker image inspect "$AI_REVIEW_REVIEWER_TAG" >/dev/null

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push images and inspect digests
        id: push-images
        shell: bash
        run: |
          set -euo pipefail
          docker push "$AI_REVIEW_BASE_TAG"
          docker push "$AI_REVIEW_REVIEWER_TAG"

          base_digest="$(
            docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$AI_REVIEW_BASE_TAG" \
              | awk -F@ -v image="$AI_REVIEW_BASE_IMAGE" '$1 == image { print $2; exit }'
          )"
          reviewer_digest="$(
            docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$AI_REVIEW_REVIEWER_TAG" \
              | awk -F@ -v image="$AI_REVIEW_REVIEWER_IMAGE" '$1 == image { print $2; exit }'
          )"

          for digest in "$base_digest" "$reviewer_digest"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest from docker inspect: $digest"
              exit 1
            fi
          done

          {
            echo "base_digest=$base_digest"
            echo "reviewer_digest=$reviewer_digest"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## AI Review Images"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Base tag: \`$AI_REVIEW_BASE_TAG\`"
            echo "- Base digest: \`$base_digest\`"
            echo "- Reviewer tag: \`$AI_REVIEW_REVIEWER_TAG\`"
            echo "- Reviewer digest: \`$reviewer_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest base image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.AI_REVIEW_BASE_IMAGE }}
          subject-digest: ${{ steps.push-images.outputs.base_digest }}
          push-to-registry: true

      - name: Attest reviewer image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.AI_REVIEW_REVIEWER_IMAGE }}
          subject-digest: ${{ steps.push-images.outputs.reviewer_digest }}
          push-to-registry: true
