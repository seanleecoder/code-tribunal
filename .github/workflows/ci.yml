name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ai-review/src
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_LINUX_ARCHIVE_SHA256: "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Release notes are pinned byte-identical to their tags, and
          # test_released_notes_remain_tag_identical compares against
          # `git show v<version>:...`. Without tags that check can only skip.
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Lychee
        shell: bash
        run: |
          set -euo pipefail
          archive="lychee-x86_64-unknown-linux-musl.tar.gz"
          directory="${archive%.tar.gz}"
          curl -fL \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          echo "${LYCHEE_LINUX_ARCHIVE_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /usr/local/bin \
            --strip-components=1 "${directory}/lychee"
      - name: Check tracked Markdown links offline
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from scripts.check_docs import LINK_CHECKED_MARKDOWN, ROOT; print("\n".join(str(path.relative_to(ROOT)) for path in LINK_CHECKED_MARKDOWN))' > /tmp/lychee-inputs
          lychee --offline --include-fragments=anchor-only --no-progress \
            --files-from /tmp/lychee-inputs
      - name: Check immutable release-note targets offline
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from scripts.check_docs import RELEASED_MARKDOWN, ROOT; print("\n".join(str(path.relative_to(ROOT)) for path in RELEASED_MARKDOWN))' > /tmp/lychee-release-inputs
          # release/1.0.1.md has one pre-existing link to the completed and
          # deleted SPEC-21. The note is tag-pinned and the obsolete spec must
          # not be restored as current documentation; grandfather that exact
          # destination while preventing any new frozen-note target break.
          if ! lychee --offline --include-fragments=none --no-progress \
            --exclude 'spec-21-cursor-cli-reviewer\.md.*' \
            --files-from /tmp/lychee-release-inputs; then
            echo "::error::Tagged release notes are immutable; restore missing link targets rather than editing the notes."
            exit 1
          fi
      - name: Quality gates
        run: make quality
