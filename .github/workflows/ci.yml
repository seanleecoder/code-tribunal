name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ai-review/src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Release notes are pinned byte-identical to their tags, and
          # test_released_notes_remain_tag_identical compares against
          # `git show v<version>:...`. Without tags that check can only skip.
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Cache pinned Lychee archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lychee-cache
          key: lychee-linux-${{ hashFiles('ai-review/images/lychee.pin') }}
      - name: Install pinned Lychee
        run: |
          python scripts/check_markdown_links.py install \
            --cache-dir "$RUNNER_TEMP/lychee-cache" \
            --bin-dir "$RUNNER_TEMP/lychee-bin"
          echo "$RUNNER_TEMP/lychee-bin" >> "$GITHUB_PATH"
      - name: Quality gates
        run: make quality
