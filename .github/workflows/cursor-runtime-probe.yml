name: Cursor Runtime Probe
run-name: Cursor Runtime Probe ${{ inputs.model }}

# Maintainer-dispatched evidence for the Cursor seat's runtime isolation; see
# docs/evidence/RUNBOOK.md#cursor-runtime-probe. It spends Cursor tokens, so it
# runs only on dispatch, from main, behind the candidate-canary approval.
on:
  workflow_dispatch:
    inputs:
      reviewer_image:
        description: Digest-pinned ai-review-reviewer image reference
        required: true
        type: string
      model:
        description: Cursor model selector
        required: false
        default: composer-2.5
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: cursor-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: candidate-canary
    timeout-minutes: 75
    steps:
      - name: Check out protected probe driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # verify-image and collect run on the runner and import repository code.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # The driver validates the model with the production model-id check.
      - name: Validate image input
        env:
          REVIEWER_IMAGE: ${{ inputs.reviewer_image }}
        run: |
          printf '%s\n' "$REVIEWER_IMAGE" | grep -Eqx \
            'ghcr\.io/seanleecoder/code-tribunal/ai-review-reviewer:[0-9]+\.[0-9]+-[0-9a-f]{40}@sha256:[0-9a-f]{64}' \
            || { echo "reviewer_image must be a digest-pinned ai-review-reviewer reference" >&2; exit 1; }
      # Candidate Canary's identity check binds the digest to the tag's source
      # commit before the Cursor key is in scope; the probe then runs that image.
      - name: Pull and verify reviewer image
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_IMAGE: ${{ inputs.reviewer_image }}
        run: |
          docker pull "$REVIEWER_IMAGE"
          python3 -B scripts/probe_cursor_runtime.py verify-image \
            --image "$REVIEWER_IMAGE" --json-out "$RUNNER_TEMP/cursor-probe-identity.json"
      - name: Run probe
        id: probe
        env:
          REVIEWER_IMAGE: ${{ inputs.reviewer_image }}
          MODEL: ${{ inputs.model }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: >-
          scripts/probe_cursor_runtime.sh "$REVIEWER_IMAGE" "$MODEL"
          "$RUNNER_TEMP/cursor-probe" "$RUNNER_TEMP/cursor-probe-identity.json"
      - name: Upload redacted results
        if: always() && steps.probe.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cursor-runtime-probe
          path: ${{ runner.temp }}/cursor-probe/
          if-no-files-found: error
