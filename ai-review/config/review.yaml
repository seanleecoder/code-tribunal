schema_version: review_config.v4

# Trusted image defaults. Custom configurations may omit seats and individual
# fields; prepare fills them from this file before applying operator overrides.
# AI_REVIEW_REVIEWERS selects three or four seats. Cursor is off by default
# because it sends repository content to Cursor's backend instead of OpenRouter.
# Adapter paths, credentials and endpoints remain in the trusted registry.
reviewers:
  claude:
    enabled: true
    model: anthropic/claude-haiku-5.5
    effort: low
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    max_findings: 50
  codex:
    enabled: true
    model: openai/gpt-6-luna
    effort: low
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    max_findings: 50
  opencode:
    enabled: true
    model: deepseek/deepseek-v4.1-flash-1017
    effort: low
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    max_findings: 50
  cursor:
    enabled: false
    model: composer-2.5
    effort: null
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    max_findings: 50

# Absence-based resolution is retained (S13). Surfacing always requires two
# independent identities; this threshold governs only cross-run resolution.
panel:
  min_successful_reviewers_for_resolution: 2

# One blind critique round always runs. Severity downgrading remains an opt-in
# policy pending the separate S11 decision; it never changes the support rule.
critique:
  allow_severity_downgrade: false

posting:
  mode: gitlab_discussions # AI_REVIEW_POSTING_MODE selects github_reviews on GitHub.
  inline_multiline: true

# State integrity, author checks and stale-head protection are unconditional.
state:
  retention:
    max_records: 200

limits:
  max_diff_bytes: 250000
  max_files: 200
  max_fyi_findings: 50
  max_prompt_bytes: 500000
