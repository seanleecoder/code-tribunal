schema_version: review_config.v3 # Schema version for config compatibility validation (must be review_config.v3)

# Configured LLM reviewer backends. Review process groups use a 1800-second
# (30-minute) timeout and critique process groups use a 900-second (15-minute)
# timeout; the CI review and critique jobs add independent 40-minute and
# 20-minute outer ceilings for wrapper and artifact overhead.
# Every reviewer below is a peer seat, and all four keys must remain present.
# Adapter paths, credentials, endpoints and capabilities are fixed by the trusted
# image registry. The primary way to choose the panel is AI_REVIEW_REVIEWERS, a
# comma-separated roster (e.g. AI_REVIEW_REVIEWERS=claude,codex,cursor) that
# enables exactly the seats it names and disables the rest. Three or four enabled
# seats are supported; the resolution threshold below clamps to the enabled
# count, so changing the roster never requires editing it in lock-step. Fewer
# than three enabled seats is rejected: a finding surfaces only when two reviewer
# identities support it independently, and a two-seat panel cannot reach that
# after losing a seat.
# Per-reviewer `model` can also be overridden without a rebuild via
# AI_REVIEW_<REVIEWER>_MODEL. See docs/configuration.md#environment-variables.
reviewers:
  claude:
    enabled: true
    model: anthropic/claude-haiku-4.5 # OpenRouter provider-qualified model identifier (override: AI_REVIEW_CLAUDE_MODEL)
    effort: medium # Reasoning/exploration effort for the claude CLI (low|medium|high|xhigh|max). Voluntary stopping, not a turn cap — stage-specific timeout fields stay the hang-catch. Override: AI_REVIEW_CLAUDE_EFFORT
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    # No turn cap: Claude runs its agentic loop to completion, bounded by
    # the stage-specific timeout as the hang-catch. A hard-coded low cap made stronger,
    # more exploratory models stop before emitting findings.
    max_findings: 50 # Cap on raw findings emitted before consensus filtering
  codex:
    enabled: true
    model: openai/gpt-5.6-luna # Model identifier passed to CLI adapter (override: AI_REVIEW_CODEX_MODEL)
    # Optional reasoning effort: low|medium|high|xhigh|max reaches Codex
    # unchanged as model_reasoning_effort. Override: AI_REVIEW_CODEX_EFFORT
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    max_findings: 50 # Cap on raw findings emitted before consensus filtering
  opencode:
    enabled: true
    model: google/gemini-3.5-flash-lite # Model identifier passed to CLI adapter (override: AI_REVIEW_OPENCODE_MODEL)
    # Optional effort/reasoning depth: low|medium|high|xhigh|max reaches
    # OpenCode unchanged as reasoningEffort. Leave effort unset here for the
    # provider default; low is the recommended starting point for flash-class
    # models. Override:
    # AI_REVIEW_OPENCODE_EFFORT
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    max_findings: 50 # Cap on raw findings emitted before consensus filtering

  # Cursor is a peer reviewer seat that is off in the shipped default roster
  # because selecting it has a consequence the other three do not: Cursor CLI
  # cannot route through OpenRouter/BYOK/custom-base-URL, so enabling it sends
  # review prompts, diffs, and any repo snapshot content it reads to Cursor's
  # backend as a deliberate second egress destination. The seat is supported;
  # off by default is about that egress path, not about maturity. Select it by
  # naming it in AI_REVIEW_REVIEWERS (e.g. claude,codex,cursor) and provide a
  # CURSOR_API_KEY secret. Do not use OPENROUTER_API_KEY for this reviewer.
  cursor:
    enabled: false # Peer seat, off by default (second egress destination). Select via AI_REVIEW_REVIEWERS
    # Cursor has no separate effort option: reasoning depth is part of the
    # model variant. Use an exact slug reported by `cursor-agent --list-models`;
    # AI_REVIEW_CURSOR_EFFORT is unsupported and rejected.
    model: auto # Valid Cursor selector: delegates model choice to Cursor. Pin an exact slug for model-stable reproducibility or model-specific evidence. Override: AI_REVIEW_CURSOR_MODEL
    timeout_seconds: 1800
    critique_timeout_seconds: 900
    max_findings: 50

# Cross-run thread lifecycle. Authored against the configured reviewer count (4)
# and clamped to the enabled count, so a smaller roster degrades rather than
# failing validation. Surfacing is not configured here: a finding surfaces when
# two reviewer identities support it independently across review and critique,
# which is a product invariant rather than an operator setting.
panel:
  min_successful_reviewers_for_resolution: 2 # Minimum successful reviewer runs required to resolve findings across runs

# Optional multi-agent cross-examination phase (critique)
critique:
  enabled: true # Override: AI_REVIEW_CRITIQUE_ENABLED (strict true/false; same var gates the CI critique jobs, default "true" in the CI template — single source of truth)
  blind_reviewer_identity: true # Anonymize reviewer identities during critique to prevent model bias
  allow_severity_downgrade: false # Security default: downgrades are opt-in and never cross blocker boundary

# Placement and formatting rules for MR inline comments & summaries
posting:
  mode: gitlab_discussions # Platform target for discussions; set github_reviews for GitHub Actions. The same value selects the adapter that stores persistent state.
  v1_inline_sides: [new, old, unchanged] # Allowed diff context sides for inline thread placement
  inline_multiline: true # Support multiline diff range comments
  fyi_mode: summary_comment # Location for non-blocking advisory findings ('summary_comment' groups in summary note)
  stale_head_guard: true # Abort posting if MR commit HEAD changes during job execution

# Persistent state management across pipeline runs. Always on: posting.mode
# selects the platform adapter that stores it (a GitLab MR state note or a GitHub
# PR comment), and there is no `backend` key to set. A document that still
# carries one is rejected.
state:
  recover_from_discussion_markers: true # Reconstruct state from inline comments if state note is lost or corrupted
  checksum_required: true # Require SHA256 integrity check on state note content
  fail_closed_on_load_error: false # If true, prepare fails instead of starting with empty state when persisted state cannot be loaded. Enforcing installs should set true (see getting-started).
  retention:
    keep_open: true # Preserve state records for open findings
    keep_wontfix: true # Preserve state records marked as won't fix
    keep_resolved_records: 5 # Number of resolved finding records to retain
    keep_stale_records: 2 # Number of stale/stale_unverified records to retain
    max_records: 200 # Max state entry count
    max_state_bytes: 50000 # Max byte size for state payload note

# Safety limits for diff size, findings, and prompts
limits:
  max_diff_bytes: 250000 # Max git diff payload size in bytes accepted for review
  max_files: 200 # Max number of changed files analyzed per review run
  max_fyi_findings: 50 # Cap on FYI findings listed in the summary comment (truncation is visible; surfaced threads are never capped)
  max_prompt_bytes: 500000 # Max prompt payload size in bytes sent to model APIs

# Runtime security controls
security:
  allow_external_fork_secrets: false # Block secret environment variables on external fork pipelines
