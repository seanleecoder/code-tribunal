stages:
  - image_validate
  - image_build
  - image_preflight
  - image_smoke
  - image_promote

variables:
  # Private GitLab registry tag slug. Public GHCR tags use semantic "1.0-<sha>".
  AI_REVIEW_IMAGE_VERSION: "1_0"
  AI_REVIEW_BASE_IMAGE: "$CI_REGISTRY_IMAGE:ai_review_base_${AI_REVIEW_IMAGE_VERSION}_$CI_COMMIT_SHA"
  AI_REVIEW_REVIEWER_IMAGE: "$CI_REGISTRY_IMAGE:ai_review_reviewer_${AI_REVIEW_IMAGE_VERSION}_$CI_COMMIT_SHA"
  # Kaniko must push before anything can run the image, so it pushes to a staging
  # tag. The commit-tagged names above are only created by the promote stage, after
  # preflight passes. Before this split the test suite ran inside the Docker build,
  # so a failure blocked the push; with the suite moved to preflight, pushing the
  # final tag in image_build would leave a failing image published under it.
  # Keyed on the pipeline id as well as the commit: a retried or concurrent pipeline
  # for the same commit must not be able to overwrite another pipeline's staging tag.
  AI_REVIEW_BASE_STAGING: "$CI_REGISTRY_IMAGE:staging_ai_review_base_${AI_REVIEW_IMAGE_VERSION}_${CI_COMMIT_SHA}_${CI_PIPELINE_ID}"
  AI_REVIEW_REVIEWER_STAGING: "$CI_REGISTRY_IMAGE:staging_ai_review_reviewer_${AI_REVIEW_IMAGE_VERSION}_${CI_COMMIT_SHA}_${CI_PIPELINE_ID}"

validate_ai_review_supply_chain_pins:
  extends: .ai_review_protected_image_rules
  stage: image_validate
  image: python:3.12-slim-bookworm@sha256:8a7e7cc04fd3e2bd787f7f24e22d5d119aa590d429b50c95dfe12b3abe52f48b
  script:
    - python scripts/check_supply_chain_pins.py

.ai_review_protected_image_rules:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "merge_request_event"'

.ai_review_kaniko:
  extends: .ai_review_protected_image_rules
  image:
    name: gcr.io/kaniko-project/executor:debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > /kaniko/.docker/config.json

build_ai_review_base_image:
  extends: .ai_review_kaniko
  stage: image_build
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/ai-review/images/base.Dockerfile" \
        --destination "$AI_REVIEW_BASE_STAGING" \
        --digest-file "$CI_PROJECT_DIR/base.digest" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL"
    # Exported as dotenv so every downstream job can pin to this exact manifest
    # rather than re-resolving a tag.
    - echo "BASE_DIGEST=$(cat "$CI_PROJECT_DIR/base.digest")" > "$CI_PROJECT_DIR/base.env"
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - base.digest
    reports:
      dotenv: base.env

build_ai_review_reviewer_image:
  extends: .ai_review_kaniko
  stage: image_build
  needs:
    - job: build_ai_review_base_image
      artifacts: true
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/ai-review/images/reviewer.Dockerfile" \
        --destination "$AI_REVIEW_REVIEWER_STAGING" \
        --build-arg "AI_REVIEW_BASE_IMAGE=${CI_REGISTRY_IMAGE}@${BASE_DIGEST}" \
        --digest-file "$CI_PROJECT_DIR/reviewer.digest" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL"
    - echo "REVIEWER_DIGEST=$(cat "$CI_PROJECT_DIR/reviewer.digest")" > "$CI_PROJECT_DIR/reviewer.env"
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - reviewer.digest
    reports:
      dotenv: reviewer.env

preflight_ai_review_reviewer_image:
  extends: .ai_review_protected_image_rules
  stage: image_preflight
  # Pinned to the manifest the build recorded. Running "$AI_REVIEW_REVIEWER_STAGING"
  # here would re-resolve a tag at job start, so a concurrent pipeline could make
  # preflight exercise one image while promotion copies another's digest.
  image: "$CI_REGISTRY_IMAGE@$REVIEWER_DIGEST"
  needs:
    - job: build_ai_review_reviewer_image
      artifacts: true
  variables:
    PYTHONPATH: /opt/ai-review/src
    AI_REVIEW_CONFIG: /opt/ai-review/config/review.yaml
    AI_REVIEW_INPUT_DIR: /tmp/ai-review-preflight/inputs
    AI_REVIEW_OUTPUT_DIR: /tmp/ai-review-preflight/out
    AI_REVIEW_LOCAL_MOCK: "1"
    AI_REVIEW_ALLOW_LOCAL_MOCK: "true"
  script:
    - cd /tmp
    # Tests are not shipped in the image. Stage the checkout's copy into the image's
    # own tests path, because the suite resolves config/ and schemas/ relative to its
    # own location — running it from the checkout would validate the checkout's config
    # instead of the image's. Replace the tree rather than merging into it: a plain
    # `cp -R` would leave fixtures that the checkout deleted or renamed lingering from
    # the image layer, so this preflight would verify a different tree than the GitHub
    # one, which bind-mounts read-only.
    # Verify the image's OWN fixtures before the overlay hides them. The reviewer
    # preflight runs --read-only with no mount and resolves --diff/--repo from these
    # paths, so a missing or mispackaged fixture must fail here rather than be
    # silently replaced by the checkout's copy.
    - test -f /opt/ai-review/tests/fixtures/diffs/simple.diff
    - test -d /opt/ai-review/tests/fixtures/repos/simple
    - rm -rf /opt/ai-review/tests
    - mkdir -p /opt/ai-review/tests
    - cp -R "$CI_PROJECT_DIR/ai-review/tests/." /opt/ai-review/tests/
    - python -m unittest discover -s /opt/ai-review/tests -p 'test_*.py'
    - python -m compileall -q /opt/ai-review/src
    - python -m ai_review.input_bundle --help >/dev/null
    - python -m ai_review.consensus --help >/dev/null
    - python -m ai_review.post --help >/dev/null
    - python -m ai_review.gate --help >/dev/null
    - python -m ai_review.schema --help >/dev/null
    - claude --version
    - codex --version
    - opencode --version
    - rm -rf /tmp/ai-review-preflight
    - |
      python -m ai_review.input_bundle local \
        --config "$AI_REVIEW_CONFIG" \
        --diff /opt/ai-review/tests/fixtures/diffs/simple.diff \
        --repo /opt/ai-review/tests/fixtures/repos/simple \
        --out "$AI_REVIEW_INPUT_DIR"
    - /opt/ai-review/adapters/run_reviewer.sh claude review
    - /opt/ai-review/adapters/run_reviewer.sh codex review
    - /opt/ai-review/adapters/run_reviewer.sh opencode review
    - python -m ai_review.schema validate --schema finding_batch.schema.json --input "$AI_REVIEW_OUTPUT_DIR/findings/claude.json"
    - python -m ai_review.schema validate --schema finding_batch.schema.json --input "$AI_REVIEW_OUTPUT_DIR/findings/codex.json"
    - python -m ai_review.schema validate --schema finding_batch.schema.json --input "$AI_REVIEW_OUTPUT_DIR/findings/opencode.json"
    - |
      python -m ai_review.consensus \
        --config "$AI_REVIEW_CONFIG" \
        --inputs "$AI_REVIEW_INPUT_DIR" \
        --findings-dir "$AI_REVIEW_OUTPUT_DIR/findings" \
        --out "$AI_REVIEW_OUTPUT_DIR/consensus/consensus.json"
    - python -m ai_review.schema validate --schema consensus.schema.json --input "$AI_REVIEW_OUTPUT_DIR/consensus/consensus.json"

smoke_ai_review_opencode_real:
  stage: image_smoke
  image: "$CI_REGISTRY_IMAGE@$REVIEWER_DIGEST"
  needs:
    - job: build_ai_review_reviewer_image
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: manual
  allow_failure: true
  variables:
    PYTHONPATH: /opt/ai-review/src
    AI_REVIEW_CONFIG: /opt/ai-review/config/review.yaml
    AI_REVIEW_INPUT_DIR: /tmp/ai-review-opencode-real/inputs
    AI_REVIEW_OUTPUT_DIR: out/opencode-real-smoke
    AI_REVIEW_LOCAL_MOCK: "0"
    AI_REVIEW_REQUIRE_REAL_OPENROUTER: "1"
    AI_REVIEW_REQUIRE_REAL_OPENCODE: "1"
    OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  script:
    - test -n "$OPENROUTER_API_KEY"
    - rm -rf /tmp/ai-review-opencode-real
    - rm -rf out/opencode-real-smoke
    - |
      python -m ai_review.input_bundle local \
        --config "$AI_REVIEW_CONFIG" \
        --diff /opt/ai-review/tests/fixtures/diffs/simple.diff \
        --repo /opt/ai-review/tests/fixtures/repos/simple \
        --out "$AI_REVIEW_INPUT_DIR"
    - /opt/ai-review/adapters/run_reviewer.sh opencode review
    - python -m ai_review.schema validate --schema finding_batch.schema.json --input "$AI_REVIEW_OUTPUT_DIR/findings/opencode.json"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - out/opencode-real-smoke/findings/opencode.json
      - out/opencode-real-smoke/status/opencode.json

promote_ai_review_images:
  extends: .ai_review_protected_image_rules
  stage: image_promote
  image:
    name: gcr.io/go-containerregistry/crane:debug@sha256:82b7ed493481c78f20c80ecbc082d1cc61c78ad248bce1e58980ed47959055a7
    entrypoint: [""]
  needs:
    # `needs` bypasses stage barriers, so the pin gate must be named explicitly or
    # promotion could copy release tags before it has run.
    - job: validate_ai_review_supply_chain_pins
    - job: build_ai_review_base_image
      artifacts: true
    - job: build_ai_review_reviewer_image
      artifacts: true
    - job: preflight_ai_review_reviewer_image
  script:
    # Keep the credential off argv, as the kaniko jobs above deliberately do:
    # anything in this container can read /proc/*/cmdline.
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    # Promote by the digest kaniko recorded at build time, not by the staging tag.
    # Staging tags are keyed only on the commit SHA, so a retried or concurrent
    # pipeline for the same commit can overwrite one between preflight and here; a
    # tag copy would then publish an image preflight never exercised.
    - BASE_DIGEST="$(cat "$CI_PROJECT_DIR/base.digest")"
    - REVIEWER_DIGEST="$(cat "$CI_PROJECT_DIR/reviewer.digest")"
    - crane copy "${CI_REGISTRY_IMAGE}@${BASE_DIGEST}" "$AI_REVIEW_BASE_IMAGE"
    - crane copy "${CI_REGISTRY_IMAGE}@${REVIEWER_DIGEST}" "$AI_REVIEW_REVIEWER_IMAGE"
