# Canonical Code Tribunal DAG. It can be included directly or combined with
# review-child.gitlab-ci.yml in a protected child trigger. `needs` preserves
# order.

variables:
  # Public GHCR images, cut over from the Phase 5.5 private bootstrap refs.
  # Replace all three values together when bumping to a newer published commit.
  AI_REVIEW_BASE_IMAGE: "ghcr.io/seanleecoder/code-tribunal/ai-review-base:1.0-2b8b2ced429309ccce541b1590500ffaba010567@sha256:97fe3a0e2b7eede26c7ea7abaac7976dee440cc7beed9c09f7106410c29abc56"
  AI_REVIEW_REVIEWER_IMAGE: "ghcr.io/seanleecoder/code-tribunal/ai-review-reviewer:1.0-2b8b2ced429309ccce541b1590500ffaba010567@sha256:8d84d69cd945aa70b36849b11f86acba24a0b73ae50ae9b0b9b1c26c71bf76af"
  AI_REVIEW_TRUSTED_IMAGE_SHA: "2b8b2ced429309ccce541b1590500ffaba010567"
  AI_REVIEW_TRUSTED_ROOT: /opt/ai-review
  AI_REVIEW_CONFIG: /opt/ai-review/config/review.yaml
  PYTHONPATH: /opt/ai-review/src
  # Single source of truth for critique: this exact variable gates BOTH the
  # critique job-creation rule below and config's critique.enabled (via
  # apply_env_overrides). Default matches review.yaml; set "false" to disable.
  # Must be exactly "true"/"false" — any other value fails the pipeline loudly.
  AI_REVIEW_CRITIQUE_ENABLED: "true"
  # Environment-consistency contract: set AI_REVIEW_* policy overrides as
  # project/group/pipeline variables (inherited by every job). Prepare records
  # effective_config_sha256; consensus fails closed if a later job sees a
  # different effective config. Supported override names:
  # AI_REVIEW_REVIEWERS AI_REVIEW_CLAUDE_MODEL AI_REVIEW_CODEX_MODEL
  # AI_REVIEW_OPENCODE_MODEL AI_REVIEW_CURSOR_MODEL AI_REVIEW_CLAUDE_ENABLED
  # AI_REVIEW_CODEX_ENABLED AI_REVIEW_OPENCODE_ENABLED AI_REVIEW_CURSOR_ENABLED
  # AI_REVIEW_CLAUDE_EFFORT AI_REVIEW_CODEX_EFFORT AI_REVIEW_OPENCODE_EFFORT
  # AI_REVIEW_CRITIQUE_ENABLED AI_REVIEW_MERGE_GATE_ENABLED
  # AI_REVIEW_POSTING_MODE AI_REVIEW_STATE_BACKEND
  # AI_REVIEW_REVIEWERS is the panel roster: a comma-separated list of reviewers
  # (e.g. "claude,codex,cursor") that enables exactly those seats and disables
  # every other configured seat. All four reviewers are peers, so any of them may
  # be left out. It is mutually exclusive with the per-reviewer *_ENABLED flags
  # and must be project/group-scoped like every other override — a roster visible
  # to only some jobs is caught by the effective_config_sha256 check, not silently
  # applied per stage. Seats left out of the roster produce skipped artifacts, so
  # their statically declared jobs below complete quickly and do not vote.
  # AI_REVIEW_REVIEWERS requires a runtime that supports it. Jobs run
  # /opt/ai-review from $AI_REVIEW_BASE_IMAGE/$AI_REVIEW_REVIEWER_IMAGE, so an
  # image pinned before roster support ignores the variable and leaves the panel
  # at the seats enabled in review.yaml — with no error. Unlike the GitHub
  # workflow, which fails loudly on an older pin because it blanks the per-seat
  # flags, nothing here makes a stale runtime detectable: this template sets no
  # per-seat flags of its own, so an ignored roster is silent. Confirm the image
  # pins ship roster support before relying on it, or use the per-reviewer
  # *_ENABLED flags, which every supported runtime honors.
  # Do not set AI_REVIEW_LOCAL_MOCK as a project/pipeline variable in production
  # (mock is forbidden). Semantic grouping env overrides are rejected; use YAML
  # only if experimenting outside the 1.0 compatibility guarantee.

.ai_review_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_IID'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_MERGE_REQUEST_IID'

prepare_ai_review:
  stage: ai_review
  needs: []
  # Entry job for the whole flow: every other job `needs` it, so gating the
  # trigger here gates the entire review. Defaults to auto-run on MRs; set the
  # project/pipeline variable AI_REVIEW_MANUAL="true" to require a human to
  # start the review (non-blocking: un-played leaves the MR mergeable, and the
  # gate still runs once triggered). Use allow_failure: false instead if the
  # review must be mandatory-but-manual (every MR blocked awaiting a click).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_MERGE_REQUEST_ID && $AI_REVIEW_MANUAL == "true"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AI_REVIEW_MANUAL == "true"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_IID'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_MERGE_REQUEST_IID'
  image: "$AI_REVIEW_BASE_IMAGE"
  interruptible: true
  script:
    - python -m ai_review.input_bundle prepare --config "$AI_REVIEW_CONFIG" --out inputs
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - inputs/

.review_template:
  stage: ai_review
  extends: .ai_review_rules
  # Outer ceiling for the 1800s review process timeout plus wrapper/artifact
  # overhead.
  timeout: 40 minutes
  # Secret-bearing reviewer jobs must run adapter code and reviewer config from
  # the trusted review image/repository, not from MR-controlled code. Runtime
  # endpoint/model validation is defense in depth, not the trust boundary.
  image: "$AI_REVIEW_REVIEWER_IMAGE"
  interruptible: true
  allow_failure: true
  variables:
    AI_REVIEW_INPUT_DIR: inputs
    AI_REVIEW_OUTPUT_DIR: out
    AI_REVIEW_LOCAL_MOCK: "0"
    OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
    AI_REVIEW_REQUIRE_REAL_OPENROUTER: "1"
  needs:
    - job: prepare_ai_review
      artifacts: true
  script:
    - /opt/ai-review/adapters/run_reviewer.sh "$REVIEWER" review
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - out/findings/
      - out/status/

"AI review: [claude]":
  extends: .review_template
  variables:
    REVIEWER: claude
    AI_REVIEW_REQUIRE_REAL_CLAUDE: "1"
    ANTHROPIC_BASE_URL: https://openrouter.ai/api

"AI review: [codex]":
  extends: .review_template
  variables:
    REVIEWER: codex

"AI review: [opencode]":
  extends: .review_template
  variables:
    REVIEWER: opencode
    AI_REVIEW_REQUIRE_REAL_OPENCODE: "1"

"AI review: [cursor]":
  extends: .review_template
  variables:
    REVIEWER: cursor
    AI_REVIEW_REQUIRE_REAL_CURSOR: "1"

.critique_template:
  stage: ai_review
  # Outer ceiling for the 900s critique process timeout plus wrapper/artifact
  # overhead.
  timeout: 20 minutes
  image: "$AI_REVIEW_REVIEWER_IMAGE"
  interruptible: true
  allow_failure: true
  variables:
    AI_REVIEW_INPUT_DIR: inputs
    AI_REVIEW_OUTPUT_DIR: out
    AI_REVIEW_LOCAL_MOCK: "0"
    OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
    AI_REVIEW_REQUIRE_REAL_OPENROUTER: "1"
  # Critique gating must combine BOTH the enabled-flag AND the source gate in
  # this one rules: block. A job's own rules: FULLY REPLACES any rules inherited
  # via `extends` (GitLab overrides the array, it does not merge), so we cannot
  # rely on `.ai_review_rules` here — extending it would be silently shadowed.
  # Without the source gate, critique jobs are created on push/tag/schedule
  # pipelines where prepare_ai_review does NOT exist, and their non-optional
  # `needs: prepare_ai_review` fails pipeline creation. Keep these sources in
  # sync with prepare_ai_review / .ai_review_rules. The disabled-guard
  # (when: never) must be first so it wins over the source matches below.
  rules:
    - if: '$AI_REVIEW_CRITIQUE_ENABLED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_IID'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_MERGE_REQUEST_IID'
  needs:
    - job: prepare_ai_review
      artifacts: true
    - job: "AI review: [claude]"
      artifacts: true
      optional: true
    - job: "AI review: [codex]"
      artifacts: true
      optional: true
    - job: "AI review: [opencode]"
      artifacts: true
      optional: true
    - job: "AI review: [cursor]"
      artifacts: true
      optional: true
  script:
    - /opt/ai-review/adapters/run_reviewer.sh "$REVIEWER" critique
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - out/critiques/
      - out/pooled_findings/
      - out/status/

"AI critique: [claude]":
  extends: .critique_template
  variables:
    REVIEWER: claude
    AI_REVIEW_REQUIRE_REAL_CLAUDE: "1"
    ANTHROPIC_BASE_URL: https://openrouter.ai/api

"AI critique: [codex]":
  extends: .critique_template
  variables:
    REVIEWER: codex

"AI critique: [opencode]":
  extends: .critique_template
  variables:
    REVIEWER: opencode
    AI_REVIEW_REQUIRE_REAL_OPENCODE: "1"

"AI critique: [cursor]":
  extends: .critique_template
  variables:
    REVIEWER: cursor
    AI_REVIEW_REQUIRE_REAL_CURSOR: "1"

consensus_ai_review:
  stage: ai_review
  extends: .ai_review_rules
  image: "$AI_REVIEW_BASE_IMAGE"
  interruptible: true
  needs:
    - job: prepare_ai_review
      artifacts: true
    - job: "AI review: [claude]"
      artifacts: true
      optional: true
    - job: "AI review: [codex]"
      artifacts: true
      optional: true
    - job: "AI review: [opencode]"
      artifacts: true
      optional: true
    - job: "AI review: [cursor]"
      artifacts: true
      optional: true
    - job: "AI critique: [claude]"
      artifacts: true
      optional: true
    - job: "AI critique: [codex]"
      artifacts: true
      optional: true
    - job: "AI critique: [opencode]"
      artifacts: true
      optional: true
    - job: "AI critique: [cursor]"
      artifacts: true
      optional: true
  script:
    - python -m ai_review.consensus --config "$AI_REVIEW_CONFIG" --inputs inputs --findings-dir out/findings --critiques-dir out/critiques --out out/consensus/consensus.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/consensus/

post_ai_review:
  stage: ai_review
  extends: .ai_review_rules
  image: "$AI_REVIEW_BASE_IMAGE"
  interruptible: false
  resource_group: "ai-review-mr-${CI_PROJECT_ID}-${CI_MERGE_REQUEST_IID}"
  needs:
    - job: prepare_ai_review
      artifacts: true
    - job: consensus_ai_review
      artifacts: true
  script:
    - python -m ai_review.post --config "$AI_REVIEW_CONFIG" --inputs inputs --consensus out/consensus/consensus.json --out out/post/post_result.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/post/

ai_review_gate:
  stage: ai_review
  extends: .ai_review_rules
  image: "$AI_REVIEW_BASE_IMAGE"
  interruptible: false
  needs:
    - job: consensus_ai_review
      artifacts: true
    - job: post_ai_review
      artifacts: true
  script:
    - python -m ai_review.gate --config "$AI_REVIEW_CONFIG" --consensus out/consensus/consensus.json --post-result out/post/post_result.json --out out/gate/gate_result.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/gate/
