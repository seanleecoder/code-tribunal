# Canonical Code Tribunal DAG for a protected direct include.
# Same-stage needs preserve prepare/review/critique/consensus/post order.

variables:
  # Public GHCR images. Replace all three values together when bumping to a
  # newer published commit.
  AI_REVIEW_BASE_IMAGE: "ghcr.io/seanleecoder/code-tribunal/ai-review-base:2.1-6ca538106d1eef7f449e5227408c99013c75aedc@sha256:d855b177b4bfcd109f7cf1c8d86908a98dc22e83c4fbce911fdad4a68ccdaa52"
  AI_REVIEW_REVIEWER_IMAGE: "ghcr.io/seanleecoder/code-tribunal/ai-review-reviewer:2.1-6ca538106d1eef7f449e5227408c99013c75aedc@sha256:280c858d58ceee662c95f02455bb6da3846802a5d19234dc28872c02df8fa985"
  AI_REVIEW_TRUSTED_IMAGE_SHA: "6ca538106d1eef7f449e5227408c99013c75aedc"
  AI_REVIEW_CONFIG: /opt/ai-review/config/review.yaml
  PYTHONPATH: /opt/ai-review/src
  # Prepare resolves model, effort, roster and posting-mode overrides once.
  # Downstream stages consume effective_config from the prepared manifest;
  # environment changes in later jobs cannot change this run's policy.
  # AI_REVIEW_REVIEWERS selects three or four first-party seats. Jobs for omitted
  # seats write skipped artifacts and never call a provider.
  # Do not set AI_REVIEW_LOCAL_MOCK as a project/pipeline variable in production
  # (mock is forbidden).

.ai_review_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_IID'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_MERGE_REQUEST_IID'

prepare_ai_review:
  stage: ai_review
  needs: []
  # Entry job for the whole flow: every other job `needs` it, so gating the
  # trigger here gates the entire review. Defaults to auto-run on MRs; set the
  # project/pipeline variable AI_REVIEW_MANUAL="true" to require a human to
  # start the review (non-blocking: un-played leaves the MR mergeable, and the
  # review still runs once triggered). Use allow_failure: false instead if the
  # review must be mandatory-but-manual (every MR blocked awaiting a click).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AI_REVIEW_MANUAL == "true"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_IID'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_MERGE_REQUEST_IID'
  image: "$AI_REVIEW_BASE_IMAGE"
  interruptible: true
  script:
    - python -m ai_review.input_bundle prepare --config "$AI_REVIEW_CONFIG" --out inputs
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - inputs/

.review_template:
  stage: ai_review
  extends: .ai_review_rules
  # Outer ceiling for the 1800s review process timeout plus wrapper/artifact
  # overhead.
  timeout: 40 minutes
  # Secret-bearing reviewer jobs must run adapter code and reviewer config from
  # the trusted review image/repository, not from MR-controlled code. Runtime
  # endpoint/model validation is defense in depth, not the trust boundary.
  image: "$AI_REVIEW_REVIEWER_IMAGE"
  interruptible: true
  allow_failure: true
  variables: &reviewer_variables
    AI_REVIEW_INPUT_DIR: inputs
    AI_REVIEW_OUTPUT_DIR: out
    AI_REVIEW_LOCAL_MOCK: "0"
  needs:
    - job: prepare_ai_review
      artifacts: true
  script:
    - /opt/ai-review/adapters/run_reviewer.sh "$REVIEWER" review
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - out/findings/
      - out/status/

"AI review":
  extends: .review_template
  parallel:
    matrix:
      - REVIEWER: &reviewer_matrix [claude, codex, opencode, cursor]

.critique_template:
  stage: ai_review
  # Outer ceiling for the 900s critique process timeout plus wrapper/artifact
  # overhead.
  timeout: 20 minutes
  image: "$AI_REVIEW_REVIEWER_IMAGE"
  interruptible: true
  allow_failure: true
  variables: *reviewer_variables
  extends: .ai_review_rules
  needs:
    - job: prepare_ai_review
      artifacts: true
    - job: "AI review"
      artifacts: true
  script:
    - /opt/ai-review/adapters/run_reviewer.sh "$REVIEWER" critique
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - out/critiques/
      - out/pooled_findings/
      - out/status/

"AI critique":
  extends: .critique_template
  parallel:
    matrix:
      - REVIEWER: *reviewer_matrix

consensus_ai_review:
  stage: ai_review
  extends: .ai_review_rules
  image: "$AI_REVIEW_BASE_IMAGE"
  interruptible: true
  needs:
    - job: prepare_ai_review
      artifacts: true
    - job: "AI review"
      artifacts: true
    - job: "AI critique"
      artifacts: true
  script:
    - python -m ai_review.consensus --inputs inputs --findings-dir out/findings --critiques-dir out/critiques --status-dir out/status --out out/consensus/consensus.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/consensus/

# The terminal product job. Code Tribunal publishes review output and never
# decides whether a change may merge, so this job's result reports one thing:
# whether publication completed. Findings of any severity exit zero, and a
# posting failure remains a failed job unless the consuming project marks it
# allowed to fail.
#
# Deliberately NOT mirroring the GitHub template's `if: always()` guard here.
# GitLab enforces at pipeline level through "Pipelines must succeed", so a failed
# consensus_ai_review already blocks and this job staying skipped is correct.
# GitHub enforces per job, where a skipped required check never reports at all.
# The asymmetry follows from the platforms; do not "restore symmetry" by adding
# an unreachable guard.
post_ai_review:
  stage: ai_review
  extends: .ai_review_rules
  image: "$AI_REVIEW_BASE_IMAGE"
  interruptible: false
  # Serializes concurrent posting for one merge request. Unrelated to merge
  # enforcement; keep it.
  resource_group: "ai-review-mr-${CI_PROJECT_ID}-${CI_MERGE_REQUEST_IID}"
  needs:
    - job: prepare_ai_review
      artifacts: true
    - job: consensus_ai_review
      artifacts: true
  script:
    - python -m ai_review.post --inputs inputs --consensus out/consensus/consensus.json --out out/post/post_result.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/post/
