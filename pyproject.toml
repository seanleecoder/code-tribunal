# Tool configuration only. Code Tribunal is distributed as OCI images and CI
# templates; ai-review/src is an internal container implementation, not a
# supported Python distribution.

[tool.pytest.ini_options]
testpaths = ["ai-review/tests"]
pythonpath = ["ai-review/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# ai_review_smoke is the packaged-runtime smoke suite that ships in the images
# (SPEC-58). It is checked here, under the same strictness as the runtime package,
# because a mistake in it fails an image publication rather than a test run.
[tool.mypy]
python_version = "3.12"
packages = ["ai_review", "ai_review_smoke"]
mypy_path = "ai-review/src"
strict = true
